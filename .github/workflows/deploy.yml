name: deploy

# Deploys the site from a commit on main, never from whatever happens to be
# sitting in a local dist/. A Hosting release replaces the entire site, so
# every gate below runs before the release, not after.
#
# A push releases to dev. Production is a deliberate promotion, run by hand
# once dev looks right -- this is a public record, so nothing reaches
# constituents because someone pushed a work-in-progress commit.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/dataproducts/**"
      - "pipeline/pyproject.toml"
      - "pipeline/uv.lock"
      - "pipeline/check_workflows.py"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Firebase project to release to"
        type: choice
        options: [badgerpolitics-prod, badgerpolitics-dev]
        default: badgerpolitics-prod

permissions:
  contents: read

# One release at a time per target, so an automatic dev deploy never
# delays a promotion to production. Two overlapping releases to the same
# target would race, and whichever finished last would win.
concurrency:
  group: deploy-${{ inputs.target || 'badgerpolitics-dev' }}
  cancel-in-progress: false

env:
  SNAPSHOT_BUCKET: badgerpolitics-prod-snapshots
  # a push has no inputs, so it lands on dev by default
  TARGET: ${{ inputs.target || 'badgerpolitics-dev' }}

jobs:
  validate:
    name: required CI for this revision
    uses: ./.github/workflows/ci.yml

  deploy:
    name: build, verify, release
    needs: validate
    permissions:
      contents: read
      id-token: write # only the credentialed job can mint an OIDC token
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.target || 'badgerpolitics-dev' }}
      url: >-
        ${{ (inputs.target || 'badgerpolitics-dev') == 'badgerpolitics-prod'
        && 'https://badgerpolitics.org'
        || 'https://badgerpolitics-dev.web.app' }}
    steps:
      - name: Require main for deployment
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [ "$DEPLOY_REF" != "refs/heads/main" ]; then
            echo "::error::Deployments must run from main"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - id: auth
        name: Federate into GCP (no stored key)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Resolve the newest snapshot
        id: snap
        run: |
          set -euo pipefail
          latest=$(gcloud storage ls "gs://${SNAPSHOT_BUCKET}/snapshots/*.sqlite.gz" \
                   | sort | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::no snapshot in gs://${SNAPSHOT_BUCKET}/snapshots/"
            exit 1
          fi
          generation=$(gcloud storage objects describe "$latest" --format='value(generation)')
          [[ "$generation" =~ ^[0-9]+$ ]]
          echo "object=${latest}#${generation}" >> "$GITHUB_OUTPUT"
          echo "Using ${latest}#${generation}"

      # Actions base-branch caches are readable from pull requests. Keep
      # the raw database in the private bucket, and fetch this exact object
      # generation so replacement between resolution and download fails closed.
      - name: Download the snapshot
        env:
          SNAPSHOT_OBJECT: ${{ steps.snap.outputs.object }}
        run: |
          set -euo pipefail
          mkdir -p data
          gcloud storage cp "$SNAPSHOT_OBJECT" data/wi.sqlite.gz
          sha256sum data/wi.sqlite.gz >> "$GITHUB_STEP_SUMMARY"

      - name: Expand the snapshot
        run: gunzip -c data/wi.sqlite.gz > data/wi.sqlite

      - name: Confirm the database is intact
        run: |
          set -euo pipefail
          # a truncated download still produces a file; only a real query proves it
          sqlite3 data/wi.sqlite "PRAGMA quick_check;" | grep -qx ok
          bills=$(sqlite3 data/wi.sqlite "SELECT COUNT(*) FROM bills;")
          echo "snapshot holds $bills bills"
          # guards against releasing a site built from an empty or partial db
          [ "$bills" -ge 15000 ]

      # --ignore-scripts blocks arbitrary install scripts from the whole
      # dependency tree; better-sqlite3 is a native module and genuinely
      # needs to build, so it is rebuilt by name rather than by lifting the
      # blanket ban.
      - name: Install (locked, no lifecycle scripts)
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3

      # The JSON API, Atom feeds and calendars are generated from the same
      # SQLite, are gitignored, and are linked from ordinary pages. Without
      # this step the build succeeds and the release quietly drops all of
      # them -- 20,580 links, caught by the link check the first time CI ran.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Generate the data products
        working-directory: pipeline
        run: |
          uv sync --locked
          bash ../.github/scripts/timed.sh data-products uv run python -m dataproducts.build ../data/wi.sqlite ../site/public/

      - name: Fetch verified logos
        working-directory: site
        env:
          LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }}
        run: bash ../.github/scripts/timed.sh logos npm run build:logos

      - name: Build every session
        working-directory: site
        env:
          BUILD_SESSIONS: all
          PUBLIC_PLACES_KEY: ${{ vars.PUBLIC_PLACES_KEY }}
        run: bash ../.github/scripts/timed.sh astro npm run build:astro

      - name: Build the complete search index
        working-directory: site
        run: bash ../.github/scripts/timed.sh pagefind npm run build:search

      # The gate that matters: a Hosting release replaces the whole site, so
      # a build missing 21 of 23 sessions would delete ~38,000 live pages.
      - name: Preflight — build completeness
        working-directory: site
        run: bash ../.github/scripts/timed.sh preflight node scripts/preflight.mjs

      - name: Verify the built site
        working-directory: site
        env:
          BROWSER_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          # links needs no browser, so it runs alongside the three that
          # do. Those run in sequence: three concurrent Chrome instances on
          # a four-core runner starved each other into a 30s navigation
          # timeout, which reads as an a11y failure and is not one.
          bash ../.github/scripts/timed.sh links node scripts/links.mjs > /tmp/links.log 2>&1 &
          links_pid=$!
          browser_failed=0
          for h in responsive a11y verify; do
            if bash ../.github/scripts/timed.sh "$h" node "scripts/$h.mjs" > "/tmp/$h.log" 2>&1; then
              echo "::group::$h passed"; tail -3 "/tmp/$h.log"; echo "::endgroup::"
            else
              echo "::error::$h failed"; tail -25 "/tmp/$h.log"; browser_failed=1
            fi
          done
          if wait "$links_pid"; then
            echo "::group::links passed"; tail -3 /tmp/links.log; echo "::endgroup::"
          else
            echo "::error::links failed"; tail -25 /tmp/links.log; browser_failed=1
          fi
          exit $browser_failed

      - name: Release
        run: |
          bash .github/scripts/timed.sh release npx --yes firebase-tools@14 deploy \
            --only hosting \
            --project "$TARGET" \
            --non-interactive \
            --message "${GITHUB_SHA::8} via ${GITHUB_RUN_ID}"

      # Proves the release is actually serving, not just that the API
      # accepted it. Runs against the public URL, not the local build, and
      # against whichever target was released.
      - name: Smoke-test what is live
        run: |
          set -euo pipefail
          if [ "$TARGET" = "badgerpolitics-prod" ]; then
            base=https://badgerpolitics.org
          else
            base=https://badgerpolitics-dev.web.app
          fi
          echo "smoke-testing $base"
          for path in / /bills/2025/ /my-reps/ /money/ /legislators/ \
                      /feeds/weekly.xml /api/v1/meta.json; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$base$path")
            echo "$path -> $code"
            [ "$code" = "200" ]
          done
          # a cached-forever HTML page is the bug that hid a broken deploy for hours
          cc=$(curl -sSI "$base/" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print $2}')
          echo "Cache-Control: $cc"
          case "$cc" in *must-revalidate*) ;; *) echo "::error::HTML is not revalidating"; exit 1 ;; esac

      # The CSP only exists once Firebase serves it, so it cannot be tested
      # before a release. It broke site search the first time it shipped --
      # Pagefind compiles WebAssembly -- with no symptom a visitor could see.
      - name: Check the CSP against the released site
        working-directory: site
        env:
          BROWSER_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          if [ "$TARGET" = "badgerpolitics-prod" ]; then
            node scripts/csp.mjs https://badgerpolitics.org
          else
            node scripts/csp.mjs https://badgerpolitics-dev.web.app
          fi

      - name: Roll back guidance
        if: failure()
        run: |
          echo "::notice::If a release went out and is bad, roll back with:"
          echo "::notice::npx firebase-tools@14 hosting:rollback --project $TARGET"

      - name: Summarize stage timings
        if: always()
        env:
          SNAPSHOT_OBJECT: ${{ steps.snap.outputs.object }}
        run: |
          {
            echo '## Deployment stage timings'
            echo "Commit: $GITHUB_SHA"
            echo "Snapshot: $SNAPSHOT_OBJECT"
            for file in "$RUNNER_TEMP"/badger-ci/*.time; do
              [ -f "$file" ] || continue
              echo
              echo "### $(basename "$file" .time)"
              echo '```text'
              cat "$file"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain stage timings and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          # Artifact uploads do not apply GitHub's console secret masking.
          # Keep credentialed logo/release logs out of the downloadable archive.
          path: |
            ${{ runner.temp }}/badger-ci/*.time
            ${{ runner.temp }}/badger-ci/astro.log
            ${{ runner.temp }}/badger-ci/pagefind.log
            ${{ runner.temp }}/badger-ci/preflight.log
            ${{ runner.temp }}/badger-ci/links.log
            ${{ runner.temp }}/badger-ci/responsive.log
            ${{ runner.temp }}/badger-ci/a11y.log
            ${{ runner.temp }}/badger-ci/verify.log
          if-no-files-found: ignore
          retention-days: 7
