name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets absent from history and tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan with checksum-verified Gitleaks
        run: bash .github/scripts/check-secrets.sh

  pipeline:
    name: lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest

  schema:
    name: schema applies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply schema to a fresh SQLite database
        run: |
          mkdir -p data
          sqlite3 data/wi.sqlite < pipeline/importer/schema.sql
          sqlite3 data/wi.sqlite ".tables"

  site:
    name: site typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # A pull request has no credentials, so it cannot reach the SQLite
      # snapshot the real build reads. An empty database with the real
      # schema supports the component typecheck; SQL execution is covered
      # separately by integration and deployment checks.
      - name: Empty database with the real schema
        run: |
          mkdir -p data
          sqlite3 data/wi.sqlite < pipeline/importer/schema.sql
      # --ignore-scripts blocks arbitrary install scripts from the whole
      # dependency tree; better-sqlite3 is a native module and genuinely
      # needs to build, so it is rebuilt by name rather than by lifting the
      # blanket ban.
      - name: Install (locked, no lifecycle scripts)
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3
      - name: Typecheck
        working-directory: site
        run: npx --yes astro check --minimumSeverity error
      - name: Harness scripts parse
        working-directory: site
        run: |
          set -euo pipefail
          for f in scripts/*.mjs scripts/lib/*.mjs scripts/tests/*.mjs; do
            node --check "$f"
          done
      - name: Harness readiness regression tests
        working-directory: site
        env:
          BROWSER_PATH: /usr/bin/google-chrome
        run: npm run test:harness

  actions:
    name: workflows pinned + least privilege
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Validate action pins, permissions, and release boundaries
        working-directory: pipeline
        run: |
          uv sync --locked
          uv run python check_workflows.py ../.github/workflows

  infra:
    name: tofu validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      - name: Init (no backend)
        run: tofu init -backend=false
      - name: Validate
        run: tofu validate
      - name: Format check
        run: tofu fmt -check -recursive
