[project]
name = "badger-politics-pipeline"
version = "0.1.0"
description = "Nightly pipeline: openstates-scrapers (wi) JSON -> SQLite -> checks"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "lxml>=6.1.2",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]  # pinned GPL submodule: never lint, never modify

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
